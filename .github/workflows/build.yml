name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          echo "ZIP=$ZIP"
          mkdir -p src
          unzip -q "$ZIP" -d src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR=$(find src -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -e
          APK=$(find src -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' -print -quit)
          cp "$APK" ./app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 工時薪資助手-桌面小工具-APK
          path: app-debug.apk
